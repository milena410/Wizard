"use strict";
const CLOUD_BUCKET="hogwarts_wizardrp_portal_v2_2026_99481";
const CLOUD_URL=https://kvdb.io{CLOUD_BUCKET};
const LOCAL_KEY="hogwarts_portal_cache_v2";
const HOUSES=["Gryffindor","Slytherin","Ravenclaw","Hufflepuff"];
let currentRoleTab="student";
let currentAuthMode="login";
let currentUser=null;
let cloudReady=false;
let pendingSave=Promise.resolve();
const defaultState=()=>({
adminLocked:false,
adminAccount:null,
users:[],
points:{Gryffindor:100,Slytherin:100,Ravenclaw:100,Hufflepuff:100},
logs:[{text:"Yeni dönem başladı, tüm binalara 100 başlangıç puanı verildi.",time:"Dönem Başlangıcı"}],
announcements:[{title:"Hogwarts'a Hoş Geldiniz",body:"Bina puanları Büyük Salon üzerinden takip edilmektedir.",author:"Okul Yönetimi",time:"Genel"}],
messages:{Gryffindor:[],Slytherin:[],Ravenclaw:[],Hufflepuff:[]}
});
let appState=defaultState();
function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"})[c]);}
function setSyncStatus(t,off=false){const e=document.getElementById("sync-status");e.textContent=t;e.classList.toggle("offline",off);}
function showLoader(s){document.getElementById("loader").style.display=s?"flex":"none";}
function normalizeState(data){
const base=defaultState();
if(!data||typeof data!=="object"||Array.isArray(data)) throw new Error("Geçersiz veri");
const n={...base,...data};
n.adminLocked=Boolean(data.adminLocked);
n.adminAccount=data.adminAccount&&typeof data.adminAccount==="object"?data.adminAccount:null;
n.users=Array.isArray(data.users)?data.users:[];
n.points={...base.points,...(data.points&&typeof data.points==="object"?data.points:{})};
n.logs=Array.isArray(data.logs)?data.logs:[];
n.announcements=Array.isArray(data.announcements)?data.announcements:[];
n.messages={...base.messages,...(data.messages&&typeof data.messages==="object"?data.messages:{})};
HOUSES.forEach(h=>{if(!Array.isArray(n.messages[h]))n.messages[h]=[];});
return n;
}
function loadLocalState(){
try{const r=localStorage.getItem(LOCAL_KEY);if(!r)return false;appState=normalizeState(JSON.parse(r));return true;}
catch(e){return false;}
}
async function loadCloudState(){
try{
const res=await fetch(CLOUD_URL,{method:"GET",cache:"no-store"});
if(!res.ok)throw new Error(res.status);
appState=normalizeState(await res.json());
localStorage.setItem(LOCAL_KEY,JSON.stringify(appState));
cloudReady=true;
setSyncStatus("● Bulut bağlantısı aktif",false);
}catch(e){
cloudReady=false;
const had=loadLocalState();
setSyncStatus(had?"● Yerel kayıt (çevrimdışı)":"● Bulut bağlantısı yok",true);
if(!had)appState=defaultState();
}
updateAdminNotice();
if(currentUser)refreshAllViews();
return cloudReady;
}
async function saveCloudState(){
const snap=JSON.stringify(appState);
try{localStorage.setItem(LOCAL_KEY,snap);}catch(e){}
pendingSave=pendingSave.then(async()=>{
const r=await fetch(CLOUD_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:snap});
if(!r.ok)throw new Error(r.status);
cloudReady=true;
setSyncStatus("● Bulut bağlantısı aktif",false);
return true;
}).catch(e=>{
cloudReady=false;
setSyncStatus("● Yerel kayıt (buluta gönderilemedi)",true);
return false;
});
return pendingSave;
}
function showAlert(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display="block";}
function hideAlert(id){const e=document.getElementById(id);e.textContent="";e.style.display="none";}
function updateAdminNotice(){
const n=document.getElementById("admin-setup-notice");
if(!n)return;
if(!appState.adminLocked){
n.textContent="İlk yönetici hesabı bu bölümden oluşturulabilir.";
n.style.display=currentRoleTab==="admin"&&currentAuthMode==="login"?"block":"none";
}else n.style.display="none";
}
function switchAuthMode(m){
currentAuthMode=m;
document.getElementById("login-panel").style.display=m==="login"?"block":"none";
document.getElementById("register-panel").style.display=m==="register"?"block":"none";
document.getElementById("mode-login").classList.toggle("active",m==="login");
document.getElementById("mode-register").classList.toggle("active",m==="register");
document.getElementById("auth-title").textContent=m==="login"?"Büyük Kapı Seni Bekliyor":"Hogwarts'a Katıl";
document.getElementById("auth-subtitle").textContent=m==="login"?"Hogwarts hesabına giriş yap ve büyülü dünyaya katıl.":"Kendi büyülü kimliğini oluştur.";
document.getElementById("login-note").textContent=m==="login"?"Hesabın yok mu? Kayıt Ol seçeneğiyle yeni bir öğrenci veya profesör hesabı oluşturabilirsin.":"Zaten hesabın var mı? Giriş Yap seçeneğine dokun.";
hideAlert("login-error");hideAlert("register-error");updateAdminNotice();
          }function switchRoleTab(r){
currentRoleTab=r;
["student","professor","admin"].forEach(x=>document.getElementById(tab-${x}).classList.toggle("active",x===r));
document.getElementById("house-select-group").style.display=r==="student"?"block":"none";
document.getElementById("login-submit-btn").textContent=r==="admin"&&!appState.adminLocked?"👑 Yönetici Oluştur":"✨ Kapıyı Aç";
updateAdminNotice();
}
function toggleRegisterHouse(){
document.getElementById("register-house-group").style.display=document.getElementById("register-role").value==="student"?"block":"none";
}
async function handleRegister(e){
e.preventDefault();hideAlert("register-error");
const role=document.getElementById("register-role").value;
const username=document.getElementById("register-username").value.trim();
const house=document.getElementById("register-house").value;
const password=document.getElementById("register-password").value;
const confirmPassword=document.getElementById("register-password-confirm").value;
if(!/^[a-zA-Z0-9_çÇğĞıİöÖşŞüÜ-]{3,24}$/.test(username)){showAlert("register-error","Kullanıcı adı 3-24 karakter olmalı; harf, rakam, _ veya - kullanabilirsin.");return;}
if(password.length<4){showAlert("register-error","Şifre en az 4 karakter olmalı.");return;}
if(password!==confirmPassword){showAlert("register-error","Şifreler eşleşmiyor.");return;}
const exists=appState.users.some(u=>String(u.username).toLowerCase()===username.toLowerCase())||(appState.adminAccount&&String(appState.adminAccount.username).toLowerCase()===username.toLowerCase());
if(exists){showAlert("register-error","Bu kullanıcı adı zaten kullanılıyor.");return;}
const newUser={id:Date.now(),role,username,house:role==="student"?house:null,password};
appState.users.push(newUser);
showLoader(true);const saved=await saveCloudState();showLoader(false);
if(!saved){
appState.users=appState.users.filter(u=>!==);
try{localStorage.setItem(LOCAL_KEY,JSON.stringify(appState));}catch(_){}
showAlert("register-error","Buluta kayıt yapılamadı. İnternet bağlantısını kontrol edip tekrar dene.");return;
}
document.getElementById("register-form").reset();
alert("Hesabın oluşturuldu! Şimdi giriş yapabilirsin.");
switchAuthMode("login");switchRoleTab(role);
document.getElementById("login-username").value=username;
if(role==="student")document.getElementById("login-house").value=house;
}
async function handleLogin(e){
e.preventDefault();hideAlert("login-error");
const username=document.getElementById("login-username").value.trim();
const house=document.getElementById("login-house").value;
const password=document.getElementById("login-password").value;
if(!username||!password){showAlert("login-error","Lütfen kullanıcı adı ve şifreni gir.");return;}
if(currentRoleTab==="admin"){
if(!appState.adminLocked){
if(password.length<4){showAlert("login-error","Yönetici şifresi en az 4 karakter olmalı.");return;}
appState.adminAccount={username,password,role:"admin"};
appState.adminLocked=true;
showLoader(true);await saveCloudState();showLoader(false);
enterPortal({username,role:"admin",house:null});return;
}
if(appState.adminAccount&&appState.adminAccount.username.toLowerCase()===username.toLowerCase()&&appState.adminAccount.password===password){
enterPortal({username:appState.adminAccount.username,role:"admin",house:null});return;
}else{showAlert("login-error","Yönetici kullanıcı adı veya şifre hatalı.");return;}
}
const found=appState.users.find(u=>u.role===currentRoleTab&&u.username.toLowerCase()===username.toLowerCase()&&u.password===password);
if(!found){showAlert("login-error","Kullanıcı adı, rol veya şifre hatalı.");return;}
if(currentRoleTab==="student"&&!==house){showAlert("login-error",Bu öğrenci ${} binasına kayıtlı.);return;}
enterPortal(found);
  }function enterPortal(user){
currentUser=user;
document.getElementById("login-screen").style.display="none";
document.getElementById("portal-screen").style.display="block";
document.getElementById("header-user").style.display="flex";
const labels={student:🎓 Öğrenci (${}),professor:"🪄 Profesör",admin:"👑 Yönetici"};
document.getElementById("user-role-label").textContent=${user.username} • ${labels[user.role]};
document.getElementById("nav-prof-panel").style.display=(user.role==="professor"||user.role==="admin")?"inline-block":"none";
document.getElementById("nav-admin-panel").style.display=user.role==="admin"?"inline-block":"none";
document.getElementById("common-room-switcher").style.display=(user.role==="professor"||user.role==="admin")?"block":"none";

showSection("great-hall",document.querySelector(".nav-btn"));
refreshAllViews();
}
function logout(){
currentUser=null;
document.getElementById("portal-screen").style.display="none";
document.getElementById("header-user").style.display="none";
document.getElementById("login-screen").style.display="flex";
updateAdminNotice();
}
function showSection(id,btn){
document.querySelectorAll(".section-view").forEach(s=>s.classList.remove("active"));
document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
const sec=document.getElementById(sec-${id});
if(sec)sec.classList.add("active");
if(btn)btn.classList.add("active");
if(id==="common-room")renderCommonRoom();
if(id==="admin-panel")renderUsersTable();
}
function refreshAllViews(){
renderGreatHall();renderCommonRoom();
if(currentUser&&currentUser.role==="admin")renderUsersTable();
}
function renderGreatHall(){
const icons={Gryffindor:"🦁",Slytherin:"🐍",Ravenclaw:"🦅",Hufflepuff:"🦡"};
const maxPts=Math.max(200,...(h=>Number(appState.points[h])||0));
document.getElementById("houses-container").innerHTML=(h=>{
const pts=Number(appState.points[h])||0;
const pct=Math.max(0,Math.min(100,Math.round((pts/maxPts)*100)));
return <div class="house-card ${h}"><div class="house-header"><span class="house-name">${icons[h]} ${h}</span></div><div class="house-points">${pts} Puan</div><div class="hourglass-bar"><div class="hourglass-fill" style="width:${pct}%"></div></div></div>;
}).join("");document.getElementById("logs-container").innerHTML=appState.logs.length
?appState.logs.slice().reverse().map(l=><div class="feed-item"><div>${escapeHTML(l.text)}</div><div class="feed-meta">${escapeHTML(l.time)}</div></div>).join("")
:<div class="feed-item">Henüz puan hareketi yok.</div>;
document.getElementById("announcements-container").innerHTML=appState.announcements.length
?appState.announcements.slice().reverse().map(a=><div class="feed-item"><strong style="color:var(--gold-light)">${escapeHTML(a.title)}</strong><p style="margin-top:4px">${escapeHTML(a.body)}</p><div class="feed-meta">Yayınlayan: ${escapeHTML()} • ${escapeHTML(a.time)}</div></div>).join("")
:<div class="feed-item">Henüz duyuru yayınlanmadı.</div>;
}
function getActiveRoomHouse(){
if(!currentUser)return"Gryffindor";
if(currentUser.role==="student")return ;
return document.getElementById("admin-room-select").value||"Gryffindor";
}
function renderCommonRoom(){
if(!currentUser)return;
const h=getActiveRoomHouse();
const desc={
Gryffindor:"Cesaretin, atılganlığın ve şövalye ruhunun buluşma noktası.",
Slytherin:"Hırsın, kurnazlığın ve büyüklüğe giden yolun zindanlardaki kalesi.",
Ravenclaw:"Zekânın, bilgeliğin ve sınır tanımayan merakın gökyüzü kulesi.",
Hufflepuff:"Sadakatin, emeğin ve dostluğun sıcak sığınağı."
};
document.getElementById("room-banner").className=common-room-banner banner-${h};
document.getElementById("room-title").textContent=${h} Ortak Salonu;
document.getElementById("room-desc").textContent=desc[h];
const msgBox=document.getElementById("room-messages");
const msgs=appState.messages[h]||[];
msgBox.innerHTML=msgs.length
?(m=><div class="feed-item"><strong style="color:var(--gold-light)">${escapeHTML(m.sender)}:</strong> ${escapeHTML(m.text)}<div class="feed-meta">${escapeHTML(m.time)}</div></div>).join("")
:<div class="feed-item">Bu ortak salonda henüz mesaj yok. İlk mesajı sen yaz!</div>;
msgBox.scrollTop=msgBox.scrollHeight;
const members=appState.users.filter(u=>u.role==="student"&&===h);
document.getElementById("room-members").innerHTML=members.length
?(m=><div class="feed-item">🧙 <strong>${escapeHTML(m.username)}</strong></div>).join("")
:<div class="feed-item">Bu binada henüz kayıtlı öğrenci bulunmuyor.</div>;
}
async function sendRoomMessage(e){
e.preventDefault();if(!currentUser)return;
const inp=document.getElementById("room-msg-input");
const text=inp.value.trim();if(!text)return;
const h=getActiveRoomHouse();
const time=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
appState.messages[h].push({sender:${currentUser.username}${currentUser.role!=="student"?" (Yetkili)":""},text,time});
if(appState.messages[h].length>50)appState.messages[h]=appState.messages[h].slice(-50);
inp.value="";renderCommonRoom();await saveCloudState();
  }async function updateHousePoints(e){
e.preventDefault();
if(!currentUser||(currentUser.role!=="professor"&&currentUser.role!=="admin"))return;
const house=document.getElementById("pts-house").value;
const amount=parseInt(document.getElementById("pts-amount").value,10);
const reason=document.getElementById("pts-reason").value.trim();
if(isNaN(amount)||amount===0||!reason)return;
appState.points[house]=(Number(appState.points[house])||0)+amount;
const sign=amount>0?+${amount}:${amount};
const time=new Date().toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"});
appState.logs.push({text:${house} binasına ${sign} puan (${reason}) — ${currentUser.username},time});
e.target.reset();refreshAllViews();
showLoader(true);await saveCloudState();showLoader(false);
alert(${house} binası için ${sign} puan işlendi!);
}
async function postAnnouncement(e){
e.preventDefault();
if(!currentUser||(currentUser.role!=="professor"&&currentUser.role!=="admin"))return;
const title=document.getElementById("ann-title").value.trim();
const body=document.getElementById("ann-body").value.trim();
if(!title||!body)return;
const time=new Date().toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"});
appState.announcements.push({title,body,author:currentUser.username,time});
e.target.reset();refreshAllViews();
showLoader(true);await saveCloudState();showLoader(false);
alert("Duyuru Büyük Salon'da yayınlandı!");
}
function toggleNewUserHouse(){
document.getElementById("new-user-house-group").style.display=document.getElementById("new-user-role").value==="student"?"block":"none";
}
async function createNewUser(e){
e.preventDefault();if(!currentUser||currentUser.role!=="admin")return;
const role=document.getElementById("new-user-role").value;
const username=document.getElementById("new-user-name").value.trim();
const house=document.getElementById("new-user-house").value;
const password=document.getElementById("new-user-pass").value;
const exists=appState.users.some(u=>u.username.toLowerCase()===username.toLowerCase())||(appState.adminAccount&&appState.adminAccount.username.toLowerCase()===username.toLowerCase());
if(exists){alert("Bu kullanıcı adı zaten mevcut!");return;}
appState.users.push({id:(),role,username,house:role==="student"?house:null,password});
e.target.reset();toggleNewUserHouse();renderUsersTable();
showLoader(true);await saveCloudState();showLoader(false);
alert("Yeni hesap başarıyla oluşturuldu.");
}
function renderUsersTable(){
const tbody=document.getElementById("users-table-body");
tbody.innerHTML=appState.users.length
?(u=><tr><td>${escapeHTML(u.username)}</td><td>${u.role==="student"?🎓 Öğrenci (${escapeHTML()}):"🪄 Profesör"}</td><td><button class="btn-danger" style="padding:6px 10px;font-size:.8rem" onclick="deleteUser(${})">Sil</button></td></tr>).join("")
:<tr><td colspan="3" style="color:var(--text-muted)">Kayıtlı kullanıcı bulunmuyor.</td></tr>;
}
async function deleteUser(id){
if(!currentUser||currentUser.role!=="admin")return;
if(!confirm("Bu hesabı silmek istediğine emin misin?"))return;
appState.users=appState.users.filter(u=>!==id);
renderUsersTable();showLoader(true);await saveCloudState();showLoader(false);
}
